{% extends 'base.html' %}
{% block body %}
<section class="card login">
  <h1>Iniciar sesión</h1>
  <form method="post">
    <label>Usuario
      <input name="usuario" required autocomplete="username" placeholder="Tu usuario">
    </label>
    <label>Contraseña
      <input type="password" name="password" required autocomplete="current-password" placeholder="Tu contraseña">
    </label>
    <button>Entrar</button>
  </form>
  <p><a href="{{ url_for('registro') }}">¿Eres donante y no tienes cuenta? Regístrate</a></p>
</section>
{% endblock %}
